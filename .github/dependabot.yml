version: 2
updates:
  # The package contains signed/native runtimes for all targets. Keep upgrades
  # reviewable and rerun the MCP contract checks; no automatic merge or release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "open-computer-use"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(computer)"

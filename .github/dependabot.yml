version: 2
updates:
  # Updating the SDK also refreshes its exact-version native dependencies in
  # package-lock.json. Keep upgrades reviewable; no automatic merge or release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@trycua/cua-driver"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(computer)"

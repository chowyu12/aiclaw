name: Desktop Release
on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - 'tools/computer-use/**'
      - 'tools/claw-agent/internal/agent/computer-tools.json'
      - 'scripts/build-computer-runtime.mjs'
      - 'scripts/mac-signing.mjs'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "22"

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Download Electron for desktop smoke
        run: npm run setup:electron
      - name: Go format, vet, no-cgo probe
        run: make fmt-check vet nocgo
      - name: Go tests
        run: go test -race -count=1 ./...
      - name: Build client and desktop, typecheck
        run: make build-client build-desktop typecheck
      - name: Renderer unit tests
        run: |
          npm run test:renderer
          npm run test:updater
      - name: Kernel smoke (real claw-agent over JSON-RPC)
        run: make build-go && npm run smoke
      - name: Desktop smoke (preload, IPC bridge, page render)
        # Electron needs a display and its usual GTK/NSS libraries; xvfb
        # provides a virtual display on the headless runner.
        # Electron's Linux sandbox needs its SUID helper owned by root with
        # mode 4755; npm cannot set that, so Electron aborts at startup on the
        # runner ("The SUID sandbox helper binary was found, but is not
        # configured correctly"). Fix the helper rather than pass --no-sandbox:
        # the smoke should run with the same sandbox the app ships with.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 >/dev/null
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run --auto-servernum npm run smoke:desktop

  computer-contract:
    name: Independent macOS Computer Use
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - run: npm run setup:electron
      - name: Import the fixed signing identity
        env:
          AICLAW_MAC_SIGNING_P12_BASE64: ${{ secrets.AICLAW_MAC_SIGNING_P12_BASE64 }}
          AICLAW_MAC_SIGNING_PASSWORD: ${{ secrets.AICLAW_MAC_SIGNING_PASSWORD }}
        run: node scripts/mac-signing.mjs --setup
      - name: Fingerprint native runtime inputs
        id: native-inputs
        run: echo "fingerprint=$(node scripts/build-computer-runtime.mjs --universal --fingerprint)" >> "$GITHUB_OUTPUT"
      # Master seeds the default-branch cache; tags can restore it across releases.
      # The builder verifies the pinned signer and signed input fingerprint on hits.
      - uses: actions/cache@v4
        with:
          path: apps/desktop/computer-use
          key: native-computer-${{ steps.native-inputs.outputs.fingerprint }}
      - run: npm run test:computer-native
      - run: node scripts/build-computer-runtime.mjs --development
      - run: npm run build -w @aiclaw/agent-client && npm run build:main -w @aiclaw/desktop
      # Permission-free real IPC handshake. Live input needs an interactive Mac.
      - run: npx --no-install electron scripts/smoke-computer.cjs
      - run: npx --no-install electron scripts/smoke-computer-listener-auth.cjs
      - run: npx --no-install electron scripts/smoke-computer-lifecycle.cjs
      # Only production trusts the pinned signed AIClaw client. Development
      # has a separate output and an exact local Electron CDHash pin.
      - run: node scripts/build-computer-runtime.mjs --universal
      - run: tar -czf native-computer-runtime.tar.gz -C apps/desktop computer-use
      - uses: actions/upload-artifact@v4
        with:
          name: native-computer-runtime
          path: native-computer-runtime.tar.gz
          if-no-files-found: error

  mac-sign:
    needs: package
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Import the fixed signing identity
        env:
          AICLAW_MAC_SIGNING_P12_BASE64: ${{ secrets.AICLAW_MAC_SIGNING_P12_BASE64 }}
          AICLAW_MAC_SIGNING_PASSWORD: ${{ secrets.AICLAW_MAC_SIGNING_PASSWORD }}
        run: node scripts/mac-signing.mjs --setup
      - uses: actions/download-artifact@v4
        with:
          name: aiclaw-packages
          path: package-files
      - run: node scripts/sign-mac-packages.mjs package-files
      - uses: actions/upload-artifact@v4
        with:
          name: aiclaw-mac-signed
          path: package-files/*-mac-*.zip
          if-no-files-found: error

  package:
    needs: [test, computer-contract]
    # Linux cross-packages the host; the independently built universal macOS
    # Computer Use app is transferred from the macOS contract job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: native-computer-runtime
      - run: tar -xzf native-computer-runtime.tar.gz -C apps/desktop
      - name: Package all four targets
        # scripts/package-app.mjs takes the version from GITHUB_REF_NAME when
        # it is a v* tag, so the Release version always matches the tag.
        run: make package
      - name: Zip
        # zip, not dmg: dmg can only be made on macOS. -y keeps the symlinks
        # inside the .app (Frameworks/Current etc.) as symlinks; without it
        # the bundle is broken and Gatekeeper refuses it.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v ]] || TAG="v0.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist-release
          (cd release && zip -qry "../dist-release/AIClaw-${TAG}-mac-arm64.zip" "AIClaw-darwin-arm64")
          (cd release && zip -qry "../dist-release/AIClaw-${TAG}-mac-x64.zip"   "AIClaw-darwin-x64")
          (cd release && zip -qry "../dist-release/AIClaw-${TAG}-win-x64.zip"   "AIClaw-win32-x64")
          (cd release && zip -qry "../dist-release/AIClaw-${TAG}-linux-x64.zip" "AIClaw-linux-x64")
          ls -la dist-release/
      - uses: actions/upload-artifact@v4
        with:
          name: aiclaw-packages
          path: dist-release/*.zip
          # Uploading nothing must not look like success. The default is to
          # warn, which is how three green package jobs once produced an
          # empty release.
          if-no-files-found: error

  windows-installer:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Test system shell execution on Windows
        run: node --test --experimental-strip-types --import ./scripts/ts-resolve.mjs scripts/test-command-runner.ts
      - uses: actions/download-artifact@v4
        with:
          name: aiclaw-packages
          path: package-files
      - name: Extract the packaged Windows application
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem package-files/*-win-x64.zip)
          if ($zip.Count -ne 1) { throw "Expected one Windows ZIP" }
          Expand-Archive $zip[0].FullName -DestinationPath release
      - name: Build interactive Windows installer
        run: npm run package:win-installer
      - name: Test installation, replacement and user-data retention on Windows
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist-release/*-win-x64-setup.exe)
          if ($installer.Count -ne 1) { throw "Expected one Windows installer" }
          ./scripts/smoke-win-installer.ps1 -Installer $installer[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: aiclaw-windows-installer
          path: dist-release/*-win-x64-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac-sign, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: aiclaw-packages
          path: release/base
      - uses: actions/download-artifact@v4
        with:
          name: aiclaw-mac-signed
          path: release/mac
      - uses: actions/download-artifact@v4
        with:
          name: aiclaw-windows-installer
          path: release/installer
      - name: Prepare notes and checksums
        # actions/checkout fetches the tag by commit SHA, which leaves a
        # lightweight tag behind and loses the annotation — the release then
        # shows the commit message instead of the notes. Fetch the real tag.
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "AIClaw ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          mkdir -p dist-release
          cp release/base/*-win-x64.zip release/base/*-linux-x64.zip release/mac/*.zip release/installer/*.exe dist-release/
          cd dist-release
          # Fail loudly on an empty download rather than publishing a release
          # with nothing in it.
          count=$(find . -maxdepth 1 -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "no packages were downloaded"; exit 1; }
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist-release/*

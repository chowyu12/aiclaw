name: Desktop Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            renderer/package-lock.json
      - name: Test Go core
        run: go test ./...
      - name: Test the Electron shell
        working-directory: electron
        run: npm ci && npm run typecheck && npm test
      - name: Build and test the interface
        working-directory: renderer
        run: npm ci && npm test && npm run build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: aiclaw-macos
            # One package per architecture; the core inside each is universal.
            pattern: release/*.dmg
          - os: windows-latest
            artifact: aiclaw-windows
            pattern: release/*.exe
          - os: ubuntu-24.04
            artifact: aiclaw-linux
            pattern: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            renderer/package-lock.json
      - name: Set application version
        shell: bash
        working-directory: electron
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION="0.0.${GITHUB_RUN_NUMBER}"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.version=process.argv[1];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$VERSION"
      - name: Build the interface
        working-directory: renderer
        run: npm ci && npm run build
      - name: Build the Go core for this platform
        working-directory: electron
        run: npm ci && node tools/build-core.mjs ${{ runner.os == 'macOS' && 'darwin' || runner.os == 'Windows' && 'win32' || 'linux' }}
      - name: Compile the shell
        working-directory: electron
        run: npm run build
      - name: Package
        working-directory: electron
        # electron-builder signs macOS builds ad-hoc without credentials,
        # matching what the Wails pipeline produced. Set CSC_LINK and
        # CSC_KEY_PASSWORD to sign properly, and APPLE_ID plus
        # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to notarise.
        env:
          # Packaging failures here are hard to diagnose after the fact: the
          # job log is the only record, and reading it needs admin rights.
          DEBUG: electron-builder
        shell: bash
        run: |
          # Hardened runtime is a signing attribute, so it is only switched on
          # when there is a certificate to sign with.
          HARDENED=""
          if [ -n "${CSC_LINK:-}" ]; then HARDENED="--config.mac.hardenedRuntime=true"; fi
          npx electron-builder --config electron-builder.yml --publish never $HARDENED
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepare notes and checksums
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "AIClaw ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release/*

name: Desktop Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.11.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Test Go core
        run: go test ./...
      - name: Test desktop bridge
        working-directory: desktop
        run: go test ./...
      - name: Generate Wails frontend bindings
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          cd desktop && wails generate module
      - name: Build desktop frontend
        working-directory: desktop/frontend
        run: npm ci && npm run build

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Set application version
        working-directory: desktop
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION="0.0.${GITHUB_RUN_NUMBER}"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json"));p.info.productVersion=process.argv[1];fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n")' "$VERSION"
      - name: Build universal macOS app
        working-directory: desktop
        run: wails build -clean -trimpath -platform darwin/universal -ldflags "-s -w"
      - name: Sign and verify macOS app
        working-directory: desktop
        run: |
          codesign --force --deep --sign - build/bin/AIClaw.app
          codesign --verify --deep --strict build/bin/AIClaw.app
      - name: Package macOS app
        working-directory: desktop
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/AIClaw.app AIClaw-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aiclaw-macos
          path: desktop/AIClaw-macos-universal.zip

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Set application version
        shell: bash
        working-directory: desktop
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION="0.0.${GITHUB_RUN_NUMBER}"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json"));p.info.productVersion=process.argv[1];fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n")' "$VERSION"
      - name: Build Windows app and installer
        working-directory: desktop
        run: wails build -clean -trimpath -platform windows/amd64 -nsis -ldflags "-s -w"
      - name: Package Windows artifacts
        shell: pwsh
        working-directory: desktop
        run: Compress-Archive -Path build/bin/* -DestinationPath AIClaw-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aiclaw-windows
          path: desktop/AIClaw-windows-amd64.zip

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Set application version
        working-directory: desktop
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION="0.0.${GITHUB_RUN_NUMBER}"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json"));p.info.productVersion=process.argv[1];fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n")' "$VERSION"
      - name: Build Linux desktop app
        working-directory: desktop
        run: wails build -clean -trimpath -platform linux/amd64 -tags webkit2_41 -ldflags "-s -w"
      - name: Package Linux app
        working-directory: desktop
        run: tar -C build/bin -czf AIClaw-linux-amd64.tar.gz AIClaw
      - uses: actions/upload-artifact@v4
        with:
          name: aiclaw-linux
          path: desktop/AIClaw-linux-amd64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepare notes and checksums
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "AIClaw ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release/*

name: Computer Use Platforms
on:
  push:
    branches: [zhouyy_onestask_computer_use_roadmap]
    paths:
      - 'tools/computer-use/**'
      - 'apps/desktop/src/main/computer*.ts'
      - 'apps/desktop/src/main/index.ts'
      - 'scripts/stage-computer-runtime.mjs'
      - 'scripts/test-computer*.ts'
      - 'scripts/smoke-computer-windows.mjs'
      - 'scripts/smoke-packaged-computer.mjs'
      - 'scripts/package-app.mjs'
      - 'tools/claw-agent/internal/agent/computer*'
      - 'internal/plugins/bundled/computer-use/**'
      - '.github/workflows/computer-platforms.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Agent registration, approval and cancellation
        run: go test -race ./tools/claw-agent/internal/agent -run 'TestComputer|TestScreenshot' -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @aiclaw/agent-client
      - run: npm run build:main -w @aiclaw/desktop
      - name: Installer and controller contracts
        run: node --test --experimental-strip-types --import ./scripts/ts-resolve.mjs scripts/test-computer-install.ts scripts/test-computer.ts scripts/test-computer-watch.ts
      - name: Native Windows UIA and window capture acceptance
        run: node scripts/smoke-computer-windows.mjs
      - name: Native clipboard transactions
        if: always()
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -STA -File tools/computer-use/windows/TestClipboard.ps1
      - name: Build complete Windows package
        shell: pwsh
        run: |
          npm run build -w @aiclaw/desktop
          $env:CGO_ENABLED='0'
          New-Item -ItemType Directory -Force build/bin/win32-x64
          go build -o build/bin/win32-x64/claw-agent.exe ./tools/claw-agent
          node scripts/package-app.mjs --platform=win32 --arch=x64
      - name: Launch actual Windows package and verify shipped runtime
        run: node scripts/smoke-packaged-computer.mjs release/AIClaw-win32-x64/AIClaw.exe
  linux-x11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Agent registration, approval and cancellation
        run: go test -race ./tools/claw-agent/internal/agent -run 'TestComputer|TestScreenshot' -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @aiclaw/agent-client
      - run: npm run build:main -w @aiclaw/desktop
      - run: node scripts/stage-computer-runtime.mjs
      - name: Controller contracts
        run: node --test --experimental-strip-types --import ./scripts/ts-resolve.mjs scripts/test-computer-install.ts scripts/test-computer.ts scripts/test-computer-watch.ts
      - run: docker build -f tools/computer-use/linux/Dockerfile.test -t aiclaw-computer-test .
      - name: Native X11 and clipboard acceptance
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/tools/computer-use/linux:/computer-use:ro" \
            -v "$PWD/tools/claw-agent/internal/agent/computer-tools.json:/Tools.json:ro" \
            aiclaw-computer-test dbus-run-session -- xvfb-run -a sh -c \
            'openbox >/tmp/openbox.log 2>&1 & sleep 1; /usr/bin/python3 /computer-use/test_clipboard.py && /usr/bin/python3 /computer-use/test_native.py /Tools.json'
      - name: Host workflow and clipboard lifetime acceptance
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/tools/computer-use/linux:/aiclaw/tests/linux:ro" \
            -v "$PWD/apps/desktop/computer-use/linux:/aiclaw/computer-use/linux:ro" \
            -v "$PWD/apps/desktop/dist/main:/aiclaw/dist/main:ro" \
            -v "$PWD/node_modules/markdown-it:/aiclaw/node_modules/markdown-it:ro" \
            -v "$PWD/package.json:/aiclaw/package.json:ro" \
            aiclaw-computer-test dbus-run-session -- xvfb-run -a sh -c \
            'openbox >/tmp/openbox.log 2>&1 & sleep 1; node /aiclaw/tests/linux/test_host.mjs'
      - name: Build complete Linux package
        run: |
          npm run build -w @aiclaw/desktop
          mkdir -p build/bin/linux-x64
          CGO_ENABLED=0 go build -o build/bin/linux-x64/claw-agent ./tools/claw-agent
          node scripts/package-app.mjs --platform=linux --arch=x64
      - name: Launch actual Linux package and verify shipped runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core libxtst6 libxcomposite1 libxfixes3 dbus-x11 xvfb openbox libnss3 libasound2t64 libgbm1
          sudo chown root:root release/AIClaw-linux-x64/chrome-sandbox
          sudo chmod 4755 release/AIClaw-linux-x64/chrome-sandbox
          dbus-run-session -- xvfb-run -a sh -c 'openbox >/tmp/openbox-package.log 2>&1 & sleep 1; node scripts/smoke-packaged-computer.mjs release/AIClaw-linux-x64/AIClaw'

appId: com.aiclaw.desktop
productName: AIClaw
copyright: Copyright © 2026 AIClaw

directories:
  output: release
  buildResources: build

# The compiled shell plus the built interface. The interface is placed beside
# the shell as `renderer/`, which is where main.ts looks for it when packaged.
files:
  - dist/**/*
  - package.json
  - from: ../renderer/dist
    to: renderer
    filter: ["**/*", "!.gitkeep"]

# The Go core ships as a resource rather than inside the app bundle's code, so
# it stays an ordinary executable the shell can spawn. tools/build-core.mjs
# produces it for the target platform before packaging.
extraResources:
  - from: core
    to: core
    filter: ["aiclaw-core", "aiclaw-core.exe"]

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      # Two single-architecture builds rather than one universal package.
      # Universal doubles the Electron download and adds a merge step, which
      # is the only structural difference between this platform and the two
      # that build cleanly. Separate artifacts are also smaller for the user,
      # who downloads one of them rather than both fused together.
      arch: [x64, arm64]
  # Hardened runtime is a signing attribute, so it only applies when there is
  # a certificate to sign with. Asking for it while also declining to sign is
  # contradictory, so both follow the same switch: set CSC_LINK and
  # CSC_KEY_PASSWORD and the build is signed with a hardened runtime, leave
  # them unset and it is ad-hoc signed, which is what the Wails pipeline
  # produced.
  # Driven by the workflow: it turns this on only when a certificate is
  # present, because hardened runtime without signing is contradictory.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Publishing is handled by the release workflow, not by electron-builder.
publish: null

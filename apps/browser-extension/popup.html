<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AIClaw 浏览器助手</title>
    <style>
      body { width: 300px; margin: 0; padding: 14px 16px; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; color: #1f2a24; background: #f4f7f4; }
      h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
      h1 img { width: 20px; height: 20px; flex: 0 0 auto; }
      .status { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #b35c00; }
      .dot.ok { background: #10813f; }
      .detail { margin: 0 0 12px; color: #5b6660; font-size: 12px; }
      label { display: block; margin-bottom: 4px; color: #5b6660; font-size: 12px; }
      input { box-sizing: border-box; width: 100%; padding: 6px 8px; border: 1px solid #cfd8d2; border-radius: 6px; font: 12px ui-monospace, Menlo, monospace; }
      button { margin-top: 8px; padding: 5px 12px; border: none; border-radius: 6px; background: #10813f; color: #fff; font-size: 12px; cursor: pointer; }
      .buttons { display: flex; gap: 8px; }
      button.ghost { background: #fff; color: #10813f; border: 1px solid #10813f; }
      .hint { margin: 10px 0 0; color: #7a857f; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1><img src="icon48.png" alt="" />AIClaw 浏览器助手</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">…</span></div>
    <p id="detail" class="detail"></p>
    <label for="token">一般不用填：AIClaw 开启「我的浏览器」后会自动弹出配对页。实在连不上，再把 AIClaw「设置 → 配置 → 浏览器」里的配对码粘到这里</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" />
    <div class="buttons">
      <button id="save">保存</button>
      <button id="repair" class="ghost">重新配对</button>
    </div>
    <p class="hint">AIClaw 只会在它自己开的后台标签页（「AIClaw」标签组）里操作；要它接管你打开的页面，在对话里告诉它。浏览器顶部出现「正在调试」提示时，点「取消」可以随时让它停手。</p>
    <script src="popup.js" type="module"></script>
  </body>
</html>

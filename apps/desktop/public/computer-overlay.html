<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>AIClaw Desktop Control</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f8fa;background:#252a32;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:9px 10px;display:flex;align-items:center;gap:8px;height:58px;font-size:12px}.mark{color:#69d68c;font-size:17px}.label{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}strong{font-weight:600;font-size:12px;white-space:nowrap}.target{font-size:10px;color:#b9c1cb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button{border:1px solid #5a6370;background:#363e49;color:#fff;border-radius:5px;font:inherit;padding:6px 7px;cursor:pointer;white-space:nowrap}button:focus-visible{outline:2px solid #8ab6ff;outline-offset:1px}#stop{border-color:#8b5c5c}body[data-mode=paused] .mark{color:#efca75}
</style></head><body><span class="mark" aria-hidden="true">▣</span><div class="label" role="status" aria-live="polite"><strong id="status">AIClaw</strong><span class="target" id="target"></span></div><button id="pause" type="button"></button><button id="resume" type="button" hidden></button><button id="stop" type="button"></button><script src="computer-overlay.js"></script></body></html>
